name: Build & publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/misto87/snapprint

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: python3 tests/test_util.py

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - uses: docker/setup-buildx-action@v3

      - name: Build (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: snapprint:test
          build-args: SNAPPRINT_VERSION=${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Crash diagnostics
        run: docker run --rm --user root -v "$PWD/tests:/dbg-tests:ro" snapprint:test bash /dbg-tests/debug_crash.sh

      - name: Slicing smoke test
        shell: bash
        run: |
          set +e
          docker run --rm --tmpfs /data:uid=1000,gid=1000 snapprint:test python3 tests/smoke.py 2>&1 | tee smoke.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            tail -c 3500 smoke.log | python3 -c 'import sys; d=sys.stdin.read(); print("::error title=smoke log tail::" + d.replace("%","%25").replace("\r","").replace("\n","%0A"))'
          fi
          exit $rc

      - name: Web server starts
        run: |
          docker run -d --name web -p 8080:8080 snapprint:test
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/health && break; sleep 1; done
          curl -fsS localhost:8080/api/profiles | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d['filaments']), 'filaments')"
          curl -fsS localhost:8080/ | grep -q SnapPrint
          docker logs web

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SNAPPRINT_VERSION=${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
